name: Game Catalog Buffer

on:
  workflow_dispatch:
  schedule:
    - cron: '10 3 * * *'

jobs:
  buffer-status:
    name: Buffer Status Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install get_games dependencies
        working-directory: get_games
        run: pip install -r requirements.txt

      - name: Status report (fails if any mode below threshold)
        working-directory: get_games
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_ACTORS_DAYS: ${{ vars.BUFFERACTORSDAYS || '14' }}
          BUFFER_MOVIES_DAYS: ${{ vars.BUFFERMOVIESDAYS || '14' }}
          BUFFER_DIRECTORS_WEEKS: ${{ vars.BUFFERDIRECTORSWEEKS || '8' }}
        run: bash append_catalog.sh --status-only --fail-on-low-buffer

  buffer-refill:
    name: Buffer Refill
    runs-on: ubuntu-latest
    needs: buffer-status
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install get_games dependencies
        working-directory: get_games
        run: pip install -r requirements.txt

      - name: Buffer-based append
        working-directory: get_games
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_ACTORS_DAYS: ${{ vars.BUFFERACTORSDAYS || '14' }}
          BUFFER_MOVIES_DAYS: ${{ vars.BUFFERMOVIESDAYS || '14' }}
          BUFFER_DIRECTORS_WEEKS: ${{ vars.BUFFERDIRECTORSWEEKS || '8' }}
          ACTORS_LIMIT: ${{ vars.ACTORSLIMIT || '50' }}
          MOVIES_LIMIT: ${{ vars.MOVIESLIMIT || '50' }}
          DIRECTORS_LIMIT: ${{ vars.DIRECTORSLIMIT || '20' }}
          CATALOG_SCHEMA_VERSION: ${{ vars.CATALOGSCHEMAVERSION || 'v1' }}
        run: bash append_catalog.sh --buffer-check

  # GitHub disables scheduled workflows after 60 days without repository
  # activity (that is what stopped the refill in June 2026). Re-enabling the
  # workflow through the API on every run resets that timer without dummy commits.
  keepalive:
    name: Keep Schedule Enabled
    runs-on: ubuntu-latest
    needs: buffer-refill
    if: always()
    permissions:
      actions: write

    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/game-catalog-buffer.yml/enable"
